[project]
name = "scienceos-atlas"
version = "0.1.0"
description = "Daily static Discover feed for ScienceOS: arXiv + HF signals + OpenAlex enrichment, published as JSON on GitHub Pages."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "pyyaml>=6.0",
  "pillow>=10.0",     # media store: every photo and logo is normalised to a small WebP
]

[project.optional-dependencies]
# Licence-permitted first-page thumbnails. pypdfium2 (Apache-2.0/BSD) instead of PyMuPDF (AGPL).
thumbs = ["pypdfium2>=4.30"]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
