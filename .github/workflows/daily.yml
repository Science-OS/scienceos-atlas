name: daily

# arXiv announces at 00:00 UTC (20:00 ET); 05:30 UTC leaves a wide margin.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Smoke test: keep at most N new papers this run (empty = no limit)"
        required: false
        default: ""
      backfill_days:
        description: "Also harvest this many extra days back (empty = automatic)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: atlas-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write       # push the append-only `media` branch and the single-commit `state` and `audio` branches
      actions: write        # prune superseded state caches
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache      # Pocket TTS and faster-whisper weights land here (cached below)
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra thumbs --frozen

      # `audio` = Pocket TTS + faster-whisper + PyAV; torch comes from the PyTorch CPU index (pyproject [tool.uv.sources]), never the CUDA wheels.
      # A separate step so a failed install never blocks the feed: without the extra the audio stage skips itself.
      - name: Install the audio extra
        continue-on-error: true
        timeout-minutes: 10
        run: uv sync --extra thumbs --extra audio --frozen

      # The speech weights (about 0.5 GB): downloaded on the first run, then restored. The key names what is in it; bump it when the models change.
      - name: Restore speech models
        id: models
        uses: actions/cache/restore@v6
        with:
          path: .hf-cache
          key: hf-models-pocket-tts-4.0.1-whisper-tiny.en-v1

      # SQLite state + thumbnails: makes the OAI harvest and the OpenAlex enrichment incremental.
      - name: Restore state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: atlas-state-${{ github.run_id }}
          restore-keys: atlas-state-

      # Cache miss (evicted, or first run in a fresh fork): bring state/atlas.sqlite back from the encrypted `state` branch.
      # No-op when the cache restored it; warns and carries on when ATLAS_STATE_KEY or the branch is missing.
      - name: Restore state snapshot
        continue-on-error: true
        env:
          ATLAS_STATE_KEY: ${{ secrets.ATLAS_STATE_KEY }}
        run: uv run atlas state restore

      # The media store is the append-only `media` branch checked out as a worktree (orphan branch on the first run).
      - name: Check out the media branch
        run: uv run atlas media checkout --media-dir media-store

      # The audio store is the single-commit `audio` branch checked out as a worktree (orphan branch on the first run): clips that are already
      # there are not synthesised again.
      - name: Check out the audio branch
        continue-on-error: true       # audio is optional: without the checkout the run still builds the feed (and synthesises into a plain directory)
        timeout-minutes: 5
        run: uv run atlas audio checkout --audio-dir audio-store

      - name: Ingest, build, validate
        timeout-minutes: 100
        env:
          ATLAS_LIMIT: ${{ github.event.inputs.limit }}
          ATLAS_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          # All optional. Briefs stay off until one of the two LLM keys exists.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run atlas run

      # New photos, logos and thumbnails: commit as chore(media): <counts> and push HEAD:media. History is never rewritten.
      - name: Publish media branch
        if: always()
        continue-on-error: true
        run: uv run atlas media publish --media-dir media-store

      # The audio brief: the whole store (last 8 days) as ONE parentless commit, force-pushed to `audio`. Unchanged clips are objects the remote
      # already has, so only the new audio is uploaded. A failure here never fails the run.
      - name: Publish audio branch
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: uv run atlas audio publish --audio-dir audio-store

      - name: Save speech models
        if: always() && steps.models.outputs.cache-hit != 'true' && hashFiles('.hf-cache/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .hf-cache
          key: hf-models-pocket-tts-4.0.1-whisper-tiny.en-v1

      - name: Save state
        if: always() && hashFiles('state/atlas.sqlite') != ''
        uses: actions/cache/save@v6
        with:
          path: state
          key: atlas-state-${{ github.run_id }}

      # Durability of everything scraped: encrypted (openssl aes-256-cbc, pbkdf2), force-pushed as ONE commit to branch `state`.
      - name: Snapshot state
        if: always() && hashFiles('state/atlas.sqlite') != ''
        continue-on-error: true
        env:
          ATLAS_STATE_KEY: ${{ secrets.ATLAS_STATE_KEY }}
        run: uv run atlas state snapshot

      - name: Delete superseded state caches
        if: always() && hashFiles('state/atlas.sqlite') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key atlas-state- --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete || true

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs
          path: state/runs
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Scheduled workflows in public repos are disabled after 60 days without repository activity.
  keepalive:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Empty commit when the last commit is older than 45 days
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((45*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (scheduled workflows pause after 60 idle days)"
            git push
          fi
